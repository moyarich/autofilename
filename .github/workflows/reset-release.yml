name: Reset AutoFilename release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Root extension package
        type: choice
        options: ["."]
        default: "."
      target-branch:
        description: Release target branch
        type: string
        default: main
      match-mode:
        description: Locate release by package.json version or exact tag
        type: choice
        options: [package-json, exact]
        default: package-json
      exact-tag:
        description: Existing v<version> release tag when using exact
        type: string
        default: ""
      dry-run:
        description: Preview without changing the release
        type: boolean
        default: true

permissions: {}

jobs:
  reset:
    permissions:
      actions: read
      contents: write
      packages: read
      pull-requests: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_reset-release.yml@main
    with:
      package: ${{ inputs.package }}
      target-branch: ${{ inputs.target-branch }}
      tag-prefix: v
      match-mode: ${{ inputs.match-mode }}
      exact-tag: ${{ inputs.exact-tag }}
      dry-run: ${{ inputs.dry-run }}
