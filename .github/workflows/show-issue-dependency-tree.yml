name: Show issue dependency tree

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/show-issue-dependency-tree.yml'

permissions:
  contents: read
  issues: read

jobs:
  dependency-tree:
    name: Render native issue dependency tree
    uses: moyarich/reusable-workflows/.github/workflows/reusable_show-issue-dependency-tree.yml@main
