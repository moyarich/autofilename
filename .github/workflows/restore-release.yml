name: Restore AutoFilename release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Root extension package
        type: choice
        options: ["."]
        default: "."
      target-branch:
        description: Release target branch
        type: string
        default: main
      match-mode:
        description: Locate release by package.json version or exact tag
        type: choice
        options: [package-json, exact]
        default: package-json
      exact-tag:
        description: Existing v<version> release tag when using exact
        type: string
        default: ""
      restore-source:
        description: Historical commit:<sha>, tag:<tag>, run:<id>, artifact:<id>, or GitHub URL
        type: string
        required: true
      skip-finalized:
        description: Skip existing finalized releases rather than modifying them
        type: boolean
        default: true
      dry-run:
        description: Preview without restoring a release
        type: boolean
        default: true

permissions: {}

jobs:
  restore:
    permissions:
      actions: read
      contents: write
      packages: read
      pull-requests: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_restore-release.yml@main
    with:
      package: ${{ inputs.package }}
      target-branch: ${{ inputs.target-branch }}
      tag-prefix: v
      match-mode: ${{ inputs.match-mode }}
      exact-tag: ${{ inputs.exact-tag }}
      restore-source: ${{ inputs.restore-source }}
      skip-finalized: ${{ inputs.skip-finalized }}
      dry-run: ${{ inputs.dry-run }}
