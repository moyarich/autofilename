name: Self-heal missing npm lockfile

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: read

concurrency:
  group: self-heal-main
  cancel-in-progress: false

jobs:
  package-lock:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.actor.login != 'github-actions[bot]' }}
    uses: moyarich/reusable-workflows/.github/workflows/reusable_npm-package-lock.yml@main
    with:
      commit: true
      node-version: "24"
