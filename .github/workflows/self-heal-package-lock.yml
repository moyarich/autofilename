name: Self-heal package lock

on:
  push:
    branches: [test/migrate-vitest-after-23]
    paths: [package.json, .github/workflows/self-heal-package-lock.yml]
  workflow_dispatch:
    inputs:
      commit:
        description: Commit repaired package-lock.json to the selected branch
        type: boolean
        default: true

permissions:
  contents: write
  packages: read

concurrency:
  group: self-heal-package-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lockfile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    uses: moyarich/reusable-workflows/.github/workflows/reusable_npm-package-lock.yml@main
    with:
      node-version: "24"
      commit: ${{ github.event_name == 'push' || inputs.commit }}
