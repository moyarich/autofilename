name: Publish VS Code extension

run-name: >-
  AutoFilename VSIX · ${{ inputs.registry }} · dry-run=${{ inputs.dry-run }}

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Extension registry
        type: choice
        options: [openvsx, marketplace, all]
        default: openvsx
      version:
        description: Exact version to validate (empty uses package.json)
        type: string
        default: ""
      release-tag:
        description: Existing GitHub release tag (empty uses v<version>)
        type: string
        default: ""
      attach-release-asset:
        description: Attach the VSIX to an existing GitHub Release on live publish
        type: boolean
        default: false
      dry-run:
        description: Preview packaging without publishing or release changes
        type: boolean
        default: true

permissions: {}

jobs:
  publish:
    name: Validate and publish VSIX
    permissions:
      contents: write
      packages: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_vscode-publish.yml@main
    with:
      package-directory: .
      target-branch: ${{ github.ref_name }}
      install-command: npm ci --include=optional
      check-command: npm run check && npm test && npm run compile
      artifact-glob: ""
      artifact-name: autofilename-vsix
      registry: ${{ inputs.registry }}
      version: ${{ inputs.version }}
      release-tag-prefix: v
      release-tag: ${{ inputs.release-tag }}
      attach-release-asset: ${{ inputs.attach-release-asset }}
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit
