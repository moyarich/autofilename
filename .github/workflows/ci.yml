name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  lint-workflows:
    name: Validate workflow syntax
    uses: moyarich/reusable-workflows/.github/workflows/reusable_actionlint.yml@main

  tests:
    name: Build and test VS Code extension
    uses: moyarich/reusable-workflows/.github/workflows/reusable_node-ci.yml@main
    with:
      package-directory: .
      node-version: "24"
