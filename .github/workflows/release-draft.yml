name: Draft VS Code extension release

on:
  workflow_dispatch:
    inputs:
      version-mode:
        description: Select manifest version or specify an exact release version
        type: choice
        options: [package-json, exact]
        default: package-json
      exact-version:
        description: Version when using exact mode
        type: string
        default: ""
      dry-run:
        description: Preview without creating or editing a release draft
        type: boolean
        default: true

permissions: {}

concurrency:
  group: autofilename-release-draft
  cancel-in-progress: false

jobs:
  draft:
    name: Draft AutoFilename release
    permissions:
      contents: write
      pull-requests: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_release-drafter.yml@main
    with:
      target-branch: main
      version-mode: ${{ inputs.version-mode }}
      exact-version: ${{ inputs.exact-version }}
      tag-prefix: v
      package-name: autofilename
      package-directory: .
      release-name: 'AutoFilename v{{VERSION}}'
      changelog-path: CHANGELOG.md
      dry-run: ${{ inputs.dry-run }}
